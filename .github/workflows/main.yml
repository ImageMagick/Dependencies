on:
  workflow_dispatch:
  push:
    branches:
    - macos-15

permissions:
  contents: read

name: Main
jobs:

  build-macos:
    name: macOS arm64 static
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: ./.github/build/macos-arm64/install.sh

      - name: Clone dependencies
        run: ./clone-dependencies.sh macos

      - name: Build
        run: ./.github/build/macos-arm64/build.sh

      - name: Generate SBOM
        run: python3 .github/build/shared/generate-sbom.py Artifacts/sbom.json

      - name: Prepare artifacts
        run: |
          cp -r /tmp/dependencies/lib Artifacts
          cp -r /tmp/dependencies/include Artifacts
          cd Artifacts
          zip -r ../macos-arm64-static.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: macos-arm64-static
          path: macos-arm64-static.zip
